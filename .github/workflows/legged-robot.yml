name: OmindOS Locomotion checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install pinned simulation environment
        run: |
          python -m pip install -r requirements-sim.txt
          python -m pip install '.[sim,test]'
      - name: Fetch and verify pinned official assets
        run: legged-robot fetch-assets --asset-dir assets/roboto-origin
      - name: Test interfaces and controller
        env:
          OMINDOS_LEGGED_TEST_ASSETS: ${{ github.workspace }}/assets/roboto-origin
        run: python -m pytest
      - name: Execute 20 second baseline
        run: legged-robot simulate --asset-dir assets/roboto-origin --scenario baseline --duration 20 --output outputs/ci-baseline
      - name: Retain simulation record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legged-robot-simulation-record
          path: outputs/ci-baseline

      - name: Build release candidate without publishing
        run: |
          python -m pip install 'build>=1.2,<2'
          python -m build --outdir dist
          python scripts/package_release.py --output dist
      - name: Retain release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: legged-robot-release-candidate
          path: dist/
